    <button class="outline-none mobile-menu-button" @click="open = ! open">
    <svg class="w-6 h-6 text-gray-500 hover:text-green-500" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
    <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
    </button>
    </div>
    </div>
  </div>
  <!-- mobile menu -->

  <ul class="">
    <li><a href="/" class="block text-sm px-2 py-4 hover:bg-green-500 transition duration-300">首页</a></li>
    <li><a href="/setup" class="block text-sm px-2 py-4 bg-green-800 transition duration-300">设置</a></li>
  </ul>
  </div>
  </nav>
  </header>
  <div class=""><h1 class="text-center text-xl">Kalecgos 平移顶</h1></div>
    <div x-data="globalData()">
    <!--DOME-->
    <template x-if="exist.dome">
    <div class="main-tab bg-slate-600"
      x-data="{open:false}"
      >

      <div class="tab-header" >
        <div class="grow">平移顶</div>
        <div><button @click="open = ! open"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" stroke="#fff" fill="#fff"><path d="M12 3v2h5.586L5 17.586V12H3v9h9v-2H6.414L19 6.414V12h2V3h-9z"/></svg></button></div>
      </div>

      <div class="tab-content" x-show="open" x-transition>
        <div>
          <p>打开继电器引脚：<input type="number" x-on:change="validatePinNumber($event)"  x-model="dome.pinstart"/></p>
          <p>停止继电器引脚：<input type="number" x-on:change="validatePinNumber($event)"  x-model="dome.pinhalt"/></p>
          <p>打开限位输入引脚：<input type="number" x-on:change="validatePinNumber($event)"  x-model="dome.pinopen"/></p>
          <p>关闭限位输入引脚：<input type="number" x-on:change="validatePinNumber($event)"  x-model="dome.pinclose"/></p>
      </div>
        <div>
            <p>运动超时时间：<input type="number" id="dometout"  x-bind:value="dome.tout" x-model="dome.tout"/> 秒</p>
        </div>
        <div>
          <p class="pt-2">无连接时自动关闭：<input type="checkbox" id="dome.enautoclose" class="bg-gray-100 p-2 text-gray-500" x-bind:value="dome.enautoclose" x-model="dome.enautoclose"/> </p>
          <p class="text-xs italic">如果 ASCOM 驱动或网页长时间没有请求，顶棚会在设定时间后自动关闭。</p>
        <p>无通信等待时间：<input type="number" id="domeautoclose"  x-bind:value="dome.autoclose" x-model="dome.autoclose"/> 分钟</p>
        </div>
        <div class="pt-2">
            <button @click="saveDomeSetting()" class="button button_green">保存</button>
            <a href="/domeconfig.txt" download class="button button_green">下载配置</a>
        </div>

      </div>

    </div>
  </template>
    <!--DOME-->
    <!-- Ascom-->

    <template x-if="relodRequest">
      <div class="fixed top-0 left-0 h-full w-full backdrop-blur-sm flex align-middle items-center">
        <div class="flex flex-col h-1/4 w-full lg:w-1/4 mx-auto justify-center items-center  rounded-md bg-white text-black">
          <p>控制板正在重启</p>
          <p>请在 10 秒后刷新页面</p>
        </div>
      </div>
    </template>

    
    <div
    class="fixed inset-0 flex flex-col-reverse items-end justify-start h-screen w-screen"
    @notice.window="addToast($event.detail)"
    style="pointer-events:none">
    <template x-for="notice of notices" :key="notice.id">
      <div
        x-show="visible.includes(notice)"
        x-transition:enter="transition ease-in duration-200"
        x-transition:enter-start="transform opacity-0 translate-y-2"
        x-transition:enter-end="transform opacity-100"
        x-transition:leave="transition ease-out duration-500"
        x-transition:leave-start="transform translate-x-0 opacity-100"
        x-transition:leave-end="transform translate-x-full opacity-0"
        @click="removeToast(notice.id)"
        class="rounded mb-4 mr-6 w-56 flex items-center justify-center text-white shadow-lg font-bold text-lg cursor-pointer"
        :class="{
          'bg-green-500': notice.type === 'success',
          'bg-blue-500': notice.type === 'info',
          'bg-orange-500': notice.type === 'warning',
          'bg-red-500': notice.type === 'error',
         }"
        style="pointer-events:all"
        x-text="notice.text">
      </div>
    </template>
  </div>
</div>


  <script>
    function globalData() {
      return {
        exist: {dome:false},
        board: [],
        dome: [],
        relodRequest : 0,
        pinIdError:0,
        notices: [],
		    visible: [],
        unusablePinForInput: [0,6,7,8,9,10,11,20,21,24,28,29,30,31,37,38],
        unusablePinForOutput: [0,6,7,8,9,10,11,20,21,24,28,29,30,31,34,35,36,37,38,39],
        ports: [80,443,43,3389,21,22],
        reload() {
          this.board = [],
          this.dome = [];
          relodRequest : 0;
          pinIdError:0;
          notices: [];
		      visible: [];
        },

        getDomeConfig(){
          fetch('/api/dome-getconfig')
          .then(response => response.json())
          .then(response => {
            this.dome = response.dome;
          });
        },

        updateData(){
          fetch('/get-config')
          .then(response => response.json())
          .then(response => {
            this.board = response.board;
            if (response.dome) { this.exist.dome = true,this.getDomeConfig()}
          });
        },

        init() {this.updateData()},
        validateString(event){ event.target.value = event.target.value.replace(/[`~!@#$%^&*()_|+\-=?;:'",.<>\{\}\[\]\\\/]/gi, ''); },
        validatePinNumber(event){
            let ionumber = parseInt(event.target.value);
            if (this.unusablePinForInput.includes(ionumber)){
              this.addToast({type:"error", text:"引脚 " + ionumber + " 不可用"})
            } else if (this.unusablePinForOutput.includes(ionumber)){
              this.addToast({type:"info", text:"引脚 " + ionumber + " 不能作为输出使用（提示）"})
            }
        },
        
        saveDomeSetting(){
            this.dome.autoclose = parseInt(this.dome.autoclose);
            this.dome.tout = parseInt(this.dome.tout);
            this.dome.pinstart = parseInt(this.dome.pinstart);
            this.dome.pinhalt = parseInt(this.dome.pinhalt);
            this.dome.pinclose = parseInt(this.dome.pinclose);
            this.dome.pinopen = parseInt(this.dome.pinopen);
            if(this.unusablePinForInput.includes(this.dome.pinopen)){
              this.addToast({type:"error", text:"平移顶配置错误：引脚 " + this.dome.pinopen + " 不能作为输入使用"});
              return;
            }
            if(this.unusablePinForInput.includes(this.dome.pinclose)){
              this.addToast({type:"error", text:"平移顶配置错误：引脚 " + this.dome.pinclose + " 不能作为输入使用"});
              return;
            }
            if(this.unusablePinForOutput.includes(this.dome.pinstart)){
              this.addToast({type:"error", text:"平移顶配置错误：引脚 " + this.dome.pinstart + " 不能作为输出使用"});
              return;
            }
            if(this.unusablePinForOutput.includes(this.dome.pinhalt)){
              this.addToast({type:"error", text:"平移顶配置错误：引脚 " + this.dome.pinhalt + " 不能作为输出使用"});
              return;
            }
            fetch('/api/dome-saveconfig',{ 
              method: 'POST',
              headers: {"Content-Type": "application/json",},
              body: JSON.stringify(this.dome)
            })
            .then(response => response.json())
            .then(response => { if (response.reboot){this.pageRefresh();} else { this.getDomeConfig();this.addToast({type:"success", text:"平移顶配置已保存"})}});
        },

        saveBoardSetting(){
          
          fetch('/save-config',{ 
              method: 'POST',
              headers: {"Content-Type": "application/json",},
              body: JSON.stringify(this.board)
            })
            .then(response => response.json())
            .then(response => { if (response.reboot){this.pageRefresh();} else this.addToast({type:"info", text:"已保存"})});
        },


        
        pageRefresh(){
          this.relodRequest = 1;
                    setTimeout(function(){
                        location.reload();
                    }, 10000);
        },
        addToast(notice) {
          notice.id = Date.now()
          this.notices.push(notice)
          this.fireToast(notice.id)
        },
        fireToast(id) {
          this.visible.push(this.notices.find(notice => notice.id == id))
          const timeShown = 3000 * this.visible.length
          setTimeout(() => {
            this.removeToast(id)
          }, timeShown)
        },
        removeToast(id) {
          const notice = this.visible.find(notice => notice.id == id)
          const index = this.visible.indexOf(notice)
          this.visible.splice(index, 1)
        },
      };
  }


  </script>
  </body>
</html>
